name: Sincronizar status com GitHub

on:
  schedule:
    # 2x/dia: cada rodada processa um lote de 300 sites (BATCH_SIZE em
    # index.ts) pra não estourar o limite de recursos do worker; com 2 rodadas
    # a base inteira (~600 sites ativos) fica em dia dentro de 1 dia.
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Chamar github-sync
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/github-sync" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 350)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "$body"
          echo "## Sincronização com GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "**HTTP status:** $status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ge 300 ]; then
            echo "github-sync falhou (HTTP $status)"
            exit 1
          fi
