name: Deploy para Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # permite rodar manualmente pelo GitHub
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 🔒 Verificar sincronização do lock file
        run: |
          cp package-lock.json package-lock.json.bak
          npm install --legacy-peer-deps --package-lock-only
          if ! diff -q package-lock.json package-lock.json.bak > /dev/null 2>&1; then
            echo "❌ package-lock.json está desatualizado em relação ao package.json!"
            echo "Execute 'npm install' localmente e faça commit do package-lock.json atualizado."
            exit 1
          fi
          mv package-lock.json.bak package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: 📤 Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_PATH }}
          # Não apaga arquivos sensíveis no servidor
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
